<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Hotel | Pet Grooming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #fdfdfd; color: #333; line-height: 1.6; }
        
        /* Premium Hero Section with Animation */
        .hero { 
            height: 80vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), 
                        url('https://images.unsplash.com/photo-1552053831-71594a27632d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80'); 
            background-size: cover; 
            background-position: center;
            animation: fadeIn 0.8s ease-in; 
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .container { max-width: 800px; margin: 50px auto; padding: 20px; text-align: center; }
        .btn { background: #333; color: white; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background: #555; }
        
        .services { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 40px; }
        .card { padding: 20px; border: 1px solid #eee; border-radius: 15px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .service-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Pet Hotel</h1>
        <p>Professional Grooming & Concierge Services</p>
        <br>
        <a href="https://wa.me/96176062737" class="btn"><i class="fab fa-whatsapp"></i> Book via WhatsApp</a>
    </div>

</body>
</html>
